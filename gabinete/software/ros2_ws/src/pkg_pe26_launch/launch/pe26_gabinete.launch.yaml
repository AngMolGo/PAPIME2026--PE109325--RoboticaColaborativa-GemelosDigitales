%YAML 1.2
---
launch:
  - include:
    file: "$(find-pkg-share ur_robot_driver)/launch/ur_control.launch.py"
    let:
      - name: "ur_type"
        value: "ur5e"
      - name: "robot_ip"
        value: "192.168.1.3"
      - name: "launch_rviz"
        value: "false"
       
  - node:
      pkg: "pkg_pe26_gabinete"
      exec: "translate_node"
      name: "translate_node"